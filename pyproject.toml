[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmri-26ws"
version = "0.0.1"
description = "CMRI (Computational Magnetic Resonance Imaging) exercises, WS 26/27"
requires-python = "==3.10.*"

# Environment translated from environment_Windowsyml.sec (conda env CMRI-25WS).
# Usage:  hatch shell            -> activate the environment
#         hatch run jupyter lab  -> start JupyterLab
[tool.hatch.envs.default]
python = "3.10"
installer = "uv"
# The exercises are not an installable package, only install the dependencies
skip-install = true
dependencies = [
  # --- PyTorch (CUDA 11.8 builds from download.pytorch.org, see env-vars below) ---
  "torch==2.1.2+cu118",
  "torchvision==0.16.2+cu118",
  "torchaudio==2.1.2+cu118",

  # --- Python packages from the conda section ---
  "certifi==2024.8.30",
