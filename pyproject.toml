[tool.hatch.envs.default.env-vars]
# PyTorch's CUDA builds are not on PyPI. "unsafe-best-match" lets uv pick each
# package from whichever index has the pinned version (PyPI or the PyTorch index).
UV_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cu118"
UV_INDEX_STRATEGY = "unsafe-best-match"